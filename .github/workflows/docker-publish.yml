name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same rationale as DEPLOYMENT.md: these are only read at build
          # time by lib/db/db.ts and lib/auth.ts to satisfy module-level
          # env checks. The running container gets real values via its own
          # env vars/secrets at deploy time, not from this build.
          build-args: |
            DATABASE_URL=postgresql://placeholder:placeholder@placeholder:5432/placeholder
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
            SUPABASE_SERVICE_ROLE_KEY=placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
